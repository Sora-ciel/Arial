// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            // @capgo/capacitor-social-login pulls in androidx.browser:browser via two
            // conflicting paths (a direct 1.9.0 dependency for the disabled Apple provider,
            // and a strict 1.4.0 constraint via androidbrowserhelper for Google). 1.9.0 needs
            // compileSdk 36 / AGP 8.9.1+, which this project doesn't use, so force the older
            // version that androidbrowserhelper already constrains to.
            force 'androidx.browser:browser:1.4.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
